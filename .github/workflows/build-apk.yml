name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -n -E "wrong|FAILURE|Caused|Could not|not found|error:|Error" build.log | head -10 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
            tail -n 10 build.log | while IFS= read -r l; do echo "::warning::${l:0:400}"; done
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: karam-apk
          path: app/build/outputs/apk/debug/*.apk
